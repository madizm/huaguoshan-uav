[dependency-groups]
dev = [
  "pytest>=8,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huaguoshan-risk-engine"
version = "0.1.0"
description = "Defense-ring target risk assessment engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.9,<3",
  "uvicorn>=0.30,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/risk_engine"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/risk_engine/tests"]
